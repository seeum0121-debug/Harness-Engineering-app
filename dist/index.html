<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153f35">
  <meta name="description" content="약리학 강의자료 기반 약물명·MOA·용도 매칭과 A/B 판정 퀴즈. 로그인 없이 공부하고 오답을 복습하세요.">

<body>
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><rect x="5" y="5" width="16" height="16" rx="3"/><path d="M16 2H5a3 3 0 0 0-3 3v11M9 10h8M9 14h5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5v16M3 3c4-1 7 0 9 2 2-2 5-3 9-2v16c-4-1-7 0-9 2-2-2-5-3-9-2Z"/></symbol>

    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
